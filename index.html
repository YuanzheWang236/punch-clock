<title>插卡打卡钟</title>

<style>
/* Layout: a white electronic time recorder (card feeds into the top slit) on the left; the day's printed attendance sheet on the right. Machine and paper are physical objects and keep their own colors in both themes. */
:root {
  --bg: #e6e8ea;
  --fg: #23272b;
  --muted: #687079;
  --line: rgba(35, 39, 43, .14);
  /* machine plastic */
  --plastic: #fbfbfa;
  --plastic-mid: #ededeb;
  --plastic-dk: #d6d7d4;
  --slit: #17181a;
  --face: #15171a;
  --lcd: #b3bea6;
  --lcd-ink: #1c2418;
  /* paper & print */
  --paper: #fbfcfd;
  --print: #3c74b6;
  --print-lt: #9fc0e4;
  --print-band: #d4e5f6;
  --print-red: #cc3b2f;
  --stamp: #34378a;
  --pen: #1d3a8c;
  --ok: #2fae5a;
  --warn: #e0412f;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; --c-other: #9a9a96;
  --rp-bg: #ffffff; --rp-head: #f5f6f7; --rp-border: #e4e6ea; --rp-text: #1f2329; --rp-sub: #646a73; --rp-faint: #a8adb4;
  --rp-hover: #f2f5fb; --rp-today: #f0f5ff; --rp-blue: #3370ff; --rp-blue-bg: #e8efff;
  --rp-green: #258a1f; --rp-green-bg: #e8f6e6; --rp-orange: #b86600; --rp-orange-bg: #fdf1e1; --rp-red: #d83931; --rp-red-bg: #fdecea;
  --f-ui: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-dot: "DotGothic16", ui-monospace, Menlo, monospace;
  --f-pen: "Long Cang", "Kaiti SC", "STKaiti", "KaiTi", cursive;
  --f-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}
html[lang="en"] { --f-pen: "Caveat", "Long Cang", "Kaiti SC", "STKaiti", "KaiTi", cursive; }
html[lang="en"] .ctitle { letter-spacing: .5em; }
html[lang="en"] .crow .lb { letter-spacing: .02em; }
html[lang="en"] .cbars.blocks .cbar { grid-template-columns: 9.5em minmax(0, 1fr) auto; }
html[lang="en"] .cbar { grid-template-columns: 6em minmax(0, 1fr) auto; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1b1d20; --fg: #e4e6e8; --muted: #9aa1a8; --line: rgba(228, 230, 232, .14); --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c-other: #77776f; --rp-bg: #22252a; --rp-head: #2a2e34; --rp-border: #3a3f46; --rp-text: #e6e8eb; --rp-sub: #a2a8b0; --rp-faint: #6c727a; --rp-hover: #2b3140; --rp-today: #26304a; --rp-blue: #6e95ff; --rp-blue-bg: #253257; --rp-green: #6ccf62; --rp-green-bg: #1f3a22; --rp-orange: #f2a540; --rp-orange-bg: #3e2e17; --rp-red: #ff7a72; --rp-red-bg: #45201f; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #1b1d20; --fg: #e4e6e8; --muted: #9aa1a8; --line: rgba(228, 230, 232, .14); --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c-other: #77776f; --rp-bg: #22252a; --rp-head: #2a2e34; --rp-border: #3a3f46; --rp-text: #e6e8eb; --rp-sub: #a2a8b0; --rp-faint: #6c727a; --rp-hover: #2b3140; --rp-today: #26304a; --rp-blue: #6e95ff; --rp-blue-bg: #253257; --rp-green: #6ccf62; --rp-green-bg: #1f3a22; --rp-orange: #f2a540; --rp-orange-bg: #3e2e17; --rp-red: #ff7a72; --rp-red-bg: #45201f; color-scheme: dark; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 16px;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--print); outline-offset: 2px; }

.top { width: 100%; max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: .06em; }
.who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.who img { width: 24px; height: 24px; border-radius: 50%; }
.who .mode { padding: 1px 8px; border: 1px solid currentColor; border-radius: 999px; font-size: 12px; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; color: var(--muted); font-size: 13px; }
.ghost:hover { color: var(--fg); }
a.ghost { text-decoration: none; }
.copy { flex: none; text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 4px; }
.copy a { color: inherit; }
.copy a:hover { color: var(--fg); }

.app { display: flex; flex-direction: column; gap: 12px; }
.layout { width: 100%; max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(340px, 4.6fr) minmax(0, 7.4fr); gap: 28px; align-items: start; }
#left { min-width: 0; }
@media (max-width: 880px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
@media (min-width: 881px) and (min-height: 560px) {
  html, body { height: 100%; overflow: hidden; }
  .app { height: 100%; }
  .layout { flex: 1; min-height: 0; align-items: stretch; }
  #left { height: 100%; min-height: 0; display: flex; justify-content: center; }
  .report { height: 100%; }
}
/* ── scene ───────────────────────────── */
.sceneBox { margin: 0 auto; flex: none; }
.scene { width: 340px; position: relative; transform-origin: top left; }

.feed { position: relative; z-index: 2; height: 336px; margin-bottom: -12px; overflow: hidden; }
.above { position: absolute; left: 0; right: 0; top: 6px; text-align: center; color: var(--muted); font-size: 13px; transition: opacity .3s; }
.above .el { font-family: var(--f-dot); font-size: 40px; color: var(--fg); letter-spacing: .04em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.above .task { color: var(--fg); font-size: 15px; font-weight: 500; margin-top: 2px; max-width: 300px; margin-inline: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.above .arrow { margin-top: 8px; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; animation: nudge 1.8s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

.card { position: absolute; left: 50%; top: 0; width: 232px; height: 306px; margin-left: -116px; will-change: transform; filter: drop-shadow(0 5px 7px rgba(0,0,0,.22)); touch-action: none; cursor: grab; outline: none; }
.card.grabbing { cursor: grabbing; filter: drop-shadow(0 12px 14px rgba(0,0,0,.25)); }
.card:focus-visible .paper { outline: 2px solid var(--print); outline-offset: 2px; }
.paper {
  position: absolute; inset: 0; background: var(--paper); color: var(--print);
  clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
  border-radius: 2px; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none;
  font-size: 10.5px; line-height: 1.2;
}
.band { height: 26px; background: var(--print-band); display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 8px; font-family: var(--f-ui); font-weight: 700; letter-spacing: .14em; font-size: 10px; flex: none; }
.band b { color: var(--print-red); letter-spacing: .3em; font-family: var(--f-body); }
.crow { display: flex; align-items: flex-end; gap: 6px; border-bottom: 1px solid var(--print-lt); padding: 0 8px; flex: none; }
.crow .lb { flex: none; padding-bottom: 4px; letter-spacing: .1em; }
.crow .val { flex: 1; min-width: 0; font-family: var(--f-pen); color: var(--pen); font-size: 18px; line-height: 1.3; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.crow.r1 { height: 24px; }
.crow.catrow { height: 28px; align-items: center; }
.crow.catrow .lb { padding-bottom: 0; }
.cats { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 3px 0; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; border: 1px solid var(--print-lt); background: transparent; color: var(--print); font: 11px/18px var(--f-body); padding: 0 6px; border-radius: 3px; cursor: pointer; }
.cat:hover { border-color: var(--print); }
.cat[aria-checked="true"] { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.cat.add { border-style: dashed; }
.crow .cats input { flex: none; width: 72px; height: 20px; line-height: 18px; font: 11px var(--f-body); color: var(--pen); background: #fff; border: 1px solid var(--print); border-radius: 3px; padding: 0 4px; }
.crow.flash2 { animation: flash .6s 2; }
.crow.r1 input { flex: 1; min-width: 0; height: 22px; line-height: 22px; font-size: 18px; padding: 0; }
.crow.r1 input.no { flex: none; width: 52px; font-family: var(--f-dot); color: var(--stamp); font-size: 13px; }
.crow.r1 input.no::placeholder { font-family: var(--f-body); font-size: 11px; }
.crow.r1 input.val::placeholder { font-size: 15px; }
.crow.r1 .no { font-family: var(--f-dot); color: var(--stamp); font-size: 13px; padding-bottom: 3px; }
.crow.r1 .sep { width: 1px; align-self: stretch; background: var(--print-lt); }
.crow input, .crow textarea { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--pen); font-family: var(--f-pen); padding: 0; outline: none; user-select: text; -webkit-user-select: text; }
.crow input { font-size: 21px; height: 34px; line-height: 34px; }
.crow textarea { font-size: 16px; line-height: 22px; height: 46px; resize: none; padding-top: 2px;
  background: repeating-linear-gradient(180deg, transparent 0 21px, var(--print-lt) 21px 22px); }
.crow input::placeholder, .crow textarea::placeholder { color: #a9bcd6; }
.crow input:focus, .crow textarea:focus { background-color: rgba(60,116,182,.06); }
.crow.flash { animation: flash .6s 2; }
@keyframes flash { 50% { background: rgba(204,59,47,.16); } }
.ctitle { text-align: center; letter-spacing: .8em; padding: 8px 0 4px 8px; font-size: 12px; font-weight: 700; flex: none; }
.cgrid { color: var(--print); font-size: 10px; margin: 0 8px; border: 1px solid var(--print-lt); border-collapse: collapse; width: calc(100% - 16px); table-layout: fixed; }
.cgrid th { font-weight: 400; border: 1px solid var(--print-lt); padding: 2px 0; background: #eef5fc; font-size: 9.5px; }
.cgrid td { border: 1px solid var(--print-lt); height: 22px; text-align: center; font-family: var(--f-dot); color: var(--stamp); font-size: 11px; white-space: nowrap; overflow: hidden; }
.cgrid td.t { font-family: var(--f-pen); color: var(--pen); font-size: 13px; text-align: left; padding-left: 3px; text-overflow: ellipsis; }
.cgrid td.o { color: var(--print-red); }
.cgrid tr.fresh td:not(.t) { animation: ink .5s ease-out; }
@keyframes ink { 0% { opacity: 0; transform: scale(1.4); } 100% { opacity: 1; transform: none; } }
.cfoot { margin-top: auto; padding: 4px 8px 6px; display: flex; justify-content: space-between; font-size: 9px; color: var(--print-lt); }

/* machine */
.machine { position: relative; z-index: 1; }
.machine.jolt { animation: jolt .16s linear; }
@keyframes jolt { 25% { transform: translateY(2px); } 60% { transform: translateY(-1px); } }
.lid {
  height: 30px; margin: 0 12px; position: relative;
  background: linear-gradient(180deg, #d9dad7, #f3f3f1 55%, #e9e9e7);
  clip-path: polygon(3% 0, 97% 0, 100% 100%, 0 100%);
}
.slit { position: absolute; left: 50%; top: 9px; width: 258px; height: 7px; margin-left: -129px; border-radius: 4px; background: var(--slit); box-shadow: inset 0 2px 3px #000, 0 1px 0 rgba(255,255,255,.8); }
.body {
  position: relative; border-radius: 16px 16px 24px 24px; padding: 14px 18px 22px;
  background: linear-gradient(90deg, var(--plastic-dk) 0%, var(--plastic) 14%, #fff 48%, var(--plastic) 84%, #d2d3d0 100%);
  box-shadow: inset 0 2px 0 #fff, inset 0 -5px 0 rgba(0,0,0,.05), 0 34px 40px -24px rgba(0,0,0,.45), 0 6px 10px -6px rgba(0,0,0,.25);
}
.panel { border-radius: 12px; padding: 10px 12px 12px; background: linear-gradient(180deg, #f2f3f1, #e4e5e3); box-shadow: inset 0 1px 3px rgba(0,0,0,.18), 0 1px 0 #fff; }
.lcd { border-radius: 4px; padding: 5px 10px 6px; background: linear-gradient(180deg, #a5b198, var(--lcd) 30%, #a9b59c); color: var(--lcd-ink); font-family: var(--f-dot); box-shadow: inset 0 2px 4px rgba(0,0,0,.35), 0 0 0 3px #3a3d40, 0 0 0 4px #9a9c9a; margin: 4px 4px 0; }
.lcd .l1 { display: flex; justify-content: space-between; font-size: 12px; opacity: .85; }
.lcd .l2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lcd .big { font-size: 26px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.lcd .msg { font-size: 13px; text-align: right; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.prow { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 0 4px; }
.leds { display: flex; gap: 14px; font-size: 11px; color: #5d6268; }
.led { display: flex; align-items: center; gap: 5px; }
.led i { width: 8px; height: 8px; border-radius: 50%; background: #b9bcbf; box-shadow: inset 0 1px 1px rgba(0,0,0,.3); }
.led.on.g i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.led.on.r i { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
.mark { font-family: var(--f-ui); font-weight: 800; font-style: italic; letter-spacing: .06em; color: #3a3e43; font-size: 15px; }
.mark span { color: var(--print-red); }
.seam { height: 1px; background: rgba(0,0,0,.08); margin: 14px 6px 0; box-shadow: 0 1px 0 #fff; }
.key { width: 22px; height: 22px; border-radius: 50%; margin: 10px auto 0; background: radial-gradient(circle at 40% 35%, #fff, #c9cbcd 60%, #9a9da0); box-shadow: 0 1px 2px rgba(0,0,0,.3); position: relative; }
.key::after { content: ""; position: absolute; left: 50%; top: 5px; bottom: 5px; width: 3px; margin-left: -1.5px; background: #55595e; border-radius: 2px; }
.window { position: relative; margin-top: 12px; aspect-ratio: 1 / .8; max-width: 100%; border-radius: 24px; padding: 7px; background: linear-gradient(180deg, #e3e4e2, #cfd0ce); box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.2); }
.dial { position: relative; width: 100%; height: 100%; border-radius: 18px; background: radial-gradient(120% 90% at 50% 40%, #23262a, var(--face) 70%); overflow: hidden; box-shadow: inset 0 3px 10px rgba(0,0,0,.8); }
.dial::after { content: ""; position: absolute; inset: 0; background: linear-gradient(128deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.04) 34%, transparent 35%); pointer-events: none; }
.cross { position: absolute; background: rgba(255,255,255,.28); }
.cross.v { left: 50%; top: 8%; bottom: 8%; width: 1px; }
.cross.h { top: 50%; left: 8%; right: 8%; height: 1px; }
.dot { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #e9eaeb; transform: translate(-50%, -50%); }
.dot.major { width: 6px; height: 6px; }
.dnum { position: absolute; transform: translate(-50%, -50%); color: #f4f5f6; font-family: var(--f-ui); font-weight: 800; font-size: 30px; line-height: 1; }
.quartz { position: absolute; left: 50%; top: 26%; transform: translateX(-50%); color: #cfd2d4; font-family: var(--f-ui); font-weight: 500; font-size: 10px; letter-spacing: .14em; }
.hand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; background: #f4f5f6; border-radius: 3px 3px 1px 1px; box-shadow: 1px 2px 3px rgba(0,0,0,.6); }
.hand.h { width: 7px; height: 25%; }
.hand.m { width: 5px; height: 37%; }
.hand.s { width: 2px; height: 40%; background: var(--warn); }
.hub { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #a9acaf); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.feet { display: flex; justify-content: space-between; padding: 0 30px; }
.feet i { width: 40px; height: 6px; border-radius: 0 0 6px 6px; background: #b8b9b7; }

.helper { width: 340px; margin: 10px auto 0; display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; font-size: 13px; color: var(--muted); }
.helper button { flex: none; background: none; border: 1px solid var(--line); color: var(--fg); padding: 6px 14px; border-radius: 6px; cursor: pointer; }
.helper button:hover { border-color: var(--muted); }

.note { font-size: 12px; color: var(--muted); margin: 0; flex: 1; min-width: 0; text-align: center; }
@media (max-width: 880px) { .note { flex-basis: 100%; order: 3; text-align: left; } }
/* ── report panel ── */
.report { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--rp-bg); color: var(--rp-text); border: 1px solid var(--rp-border); border-radius: 10px; box-shadow: 0 8px 24px -16px rgba(0,0,0,.25); overflow: hidden; }
.rp-top { padding: 10px 16px; border-bottom: 1px solid var(--rp-border); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; flex: none; background: var(--rp-head); }
.seg3 { display: inline-flex; background: var(--rp-border); border-radius: 6px; padding: 2px; }
.seg3 button { border: 0; background: transparent; color: var(--rp-sub); padding: 4px 14px; border-radius: 5px; cursor: pointer; font-size: 13px; }
.seg3 button[aria-selected="true"] { background: var(--rp-bg); color: var(--rp-text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.rp-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
.nb { border: 1px solid var(--rp-border); background: var(--rp-bg); color: var(--rp-text); border-radius: 6px; height: 30px; min-width: 30px; padding: 0 10px; cursor: pointer; font-size: 13px; }
.nb:hover { border-color: var(--rp-blue); color: var(--rp-blue); }
.plabel { font-size: 13.5px; font-weight: 500; min-width: 8em; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
#dayPick { height: 30px; border: 1px solid var(--rp-border); border-radius: 6px; background: var(--rp-bg); color: var(--rp-text); padding: 0 6px; font-size: 13px; }

.rp-body { flex: 1; min-height: 0; overflow: auto; }
.doc { padding: 22px clamp(16px, 3vw, 32px) 28px; max-width: 900px; margin: 0 auto; }
.doc-h { border-bottom: 2px solid var(--rp-text); padding-bottom: 12px; }
.kicker { font-size: 11.5px; letter-spacing: .16em; color: var(--rp-sub); text-transform: uppercase; }
.doc-h h2 { margin: 4px 0 2px; font-size: 24px; line-height: 1.25; text-wrap: balance; }
.doc-h .meta { font-size: 12.5px; color: var(--rp-sub); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--rp-border); }
.kpis > div { padding: 14px 14px 14px 0; min-width: 0; }
.kpis > div + div { padding-left: 14px; border-left: 1px solid var(--rp-border); }
.kpis .k { font-size: 12.5px; color: var(--rp-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpis .v { font-size: 26px; font-weight: 700; line-height: 1.25; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kpis .v small { font-size: 13px; font-weight: 400; color: var(--rp-sub); margin-left: 2px; }
.kpis .s { font-size: 12px; color: var(--rp-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis > div:nth-child(3) { border-left: 0; padding-left: 0; } .kpis > div:nth-child(n+3) { border-top: 1px solid var(--rp-border); } .kpis .v { font-size: 21px; } }
.sec { margin-top: 22px; min-width: 0; }

.chart { position: relative; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 12px; color: var(--rp-sub); }

.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }

.cbars { display: grid; gap: 9px; }

.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; font-variant-numeric: tabular-nums; }

/* dialog */
dialog { border: 0; padding: 0; background: transparent; width: min(420px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(10, 14, 18, .5); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-size: 14px; transition: .25s; max-width: calc(100vw - 32px); z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
<div class="app">
<header class="top">
  <div class="brand">插卡打卡钟</div>
  <p class="note" id="note"></p>
  <div class="who">
    <img id="avatar" alt="" hidden>
    <span id="whoName">正在连接…</span>
    <span class="mode" id="modeTag" hidden></span>
    <button class="ghost" id="langBtn" type="button" title="Switch language / 切换语言">EN</button>
    <button class="ghost" id="soundBtn" type="button" aria-pressed="true">声音：开</button>
    <button class="ghost" id="bakOut" type="button" title="把本机的打卡记录存成一个文件" hidden>备份</button>
    <button class="ghost" id="bakIn" type="button" title="从备份文件恢复记录，会和现有记录合并" hidden>恢复</button>
    <input type="file" id="bakFile" accept=".json,application/json" hidden>
    <a class="ghost" id="fbLink" href="#" target="_blank" rel="noopener" hidden>反馈</a>
  </div>
</header>

<main class="layout">
  <div id="left"><div class="sceneBox" id="sceneBox">
    <div class="scene" id="scene">
      <div class="feed" id="feed">
        <div class="above" id="above" hidden>
          <div class="el" id="elapsed">00:00:00</div>
          <div class="task" id="aboveTask"></div>
          <div class="arrow" aria-hidden="true"><span>▲</span><span>往上拔出卡片，结束这一段</span></div>
        </div>
        <div class="card" id="card" tabindex="0" role="group" aria-label="考勤卡。拖进卡槽开始，往上拔出结束；也可按 ↓ 插卡、↑ 拔卡">
          <div class="paper">
            <div class="band"><span>TIME CARD</span><b>考勤卡</b></div>
            <div class="crow r1"><span class="lb">NO.</span><input class="no" id="cNo" maxlength="6" placeholder="编号" aria-label="卡片编号" autocomplete="off"><span class="sep"></span><span class="lb">姓名</span><input class="val" id="cName" maxlength="12" placeholder="写上名字" aria-label="姓名" autocomplete="off"></div>
            <div class="crow catrow" id="rowCat"><span class="lb" id="catLb">类别</span><div class="cats" id="cCats" role="radiogroup" aria-labelledby="catLb"></div></div>
            <div class="crow" id="rowTask"><label class="lb" for="cTask">事项</label><input id="cTask" maxlength="40" placeholder="具体做什么" autocomplete="off"></div>
            <div class="crow"><label class="lb" for="cDesc">说明</label><textarea id="cDesc" maxlength="200" placeholder="简短描述，可随时补充"></textarea></div>
            <div class="ctitle">考 勤 卡</div>
            <table class="cgrid" aria-label="今天的打卡">
              <colgroup><col style="width:40%"><col><col><col></colgroup>
              <thead><tr><th>事项</th><th>开始</th><th>结束</th><th>用时</th></tr></thead>
              <tbody id="cRows"></tbody>
            </table>
            <div class="cfoot"><span id="cDate">2026.11</span><span>PUNCH-24 专用卡</span></div>
          </div>
        </div>
      </div>

      <div class="machine" id="machine">
        <div class="lid"><div class="slit"></div></div>
        <div class="body">
          <div class="panel">
            <div class="lcd" aria-live="polite">
              <div class="l1"><span id="lcdDate">----.--.--</span><span id="lcdWk">--</span></div>
              <div class="l2"><span class="big" id="lcdTime">--:--:--</span><span class="msg" id="lcdMsg">请插卡</span></div>
            </div>
            <div class="prow">
              <div class="leds"><span class="led g" id="ledIn"><i></i>计时中</span><span class="led r" id="ledOut"><i></i>已结束</span></div>
              <div class="mark">PUNCH<span>·</span>24</div>
            </div>
          </div>
          <div class="seam"></div>
          <div class="key" aria-hidden="true"></div>
          <div class="window" aria-hidden="true"><div class="dial" id="dial">
            <div class="cross v"></div><div class="cross h"></div>
            <div class="quartz">QUARTZ</div>
            <div class="hand h" id="hH"></div><div class="hand m" id="hM"></div><div class="hand s" id="hS"></div>
            <div class="hub"></div>
          </div></div>
        </div>
        <div class="feet" aria-hidden="true"><i></i><i></i></div>
      </div>
      <div class="helper">
        <div id="helpText">选类别、写事项，把卡推进卡槽</div>
        <button type="button" id="actBtn">插卡 · 开始</button>
      </div>
    </div>
  </div></div>

  <section class="report" aria-label="时间报告">
    <div class="rp-top">
      <div class="seg3" role="tablist" aria-label="报告类型">

        <button type="button" role="tab" data-v="week" aria-selected="true">周报</button>
        <button type="button" role="tab" data-v="month" aria-selected="false">月报</button>
      </div>
      <div class="rp-ctl">
        <button type="button" class="nb" id="prevP" aria-label="上一期">‹</button>
        <span class="plabel" id="plabel">—</span>
        <button type="button" class="nb" id="nextP" aria-label="下一期">›</button>
        <button type="button" class="nb" id="todayBtn">本周</button>
        <input type="date" id="dayPick" aria-label="跳到某一天">
      </div>
    </div>
    <div class="rp-body" id="view"></div>
    <div class="rp-foot">
      <span id="footNote">空余 = 24 小时 − 当天已记录时长</span>
      <span class="goal"><button type="button" class="btnp" id="addBtn" hidden>＋ 补记一段</button><button type="button" class="btnp" id="expReport" hidden>导出周报 PDF</button><button type="button" class="btnp" id="expCard" hidden>导出打卡卡 PDF</button></span>
    </div>
  </section>
</main>
<footer class="copy"><span id="copyTxt">© 2026 <a href="https://github.com/YuanzheWang236" target="_blank" rel="noopener">YuanzheWang236</a> · <span id="copyRest">保留所有权利，未经许可不得复制</span></span></footer>
</div>


<dialog id="dlg">
  <form class="dcard" id="dForm" method="dialog">
    <h2 id="dTitle">修改这一段</h2>
    <div class="f"><label for="eCat">类别</label><select id="eCat"></select></div>
    <div class="f"><label for="eTask">事项（具体内容，可不填）</label><input id="eTask" maxlength="40"></div>
    <div class="f"><label for="eDesc">说明</label><textarea id="eDesc" maxlength="200" rows="3"></textarea></div>
    <div class="times">
      <div class="f"><label for="eStart">开始时间</label><input type="time" id="eStart"></div>

      <button type="button" class="btn danger" id="dDel">删除</button>
      <div class="right"><button type="button" class="btn" id="dCancel">取消</button><button type="submit" class="btn primary">保存</button></div>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const LANG = (() => { try { const v = localStorage.getItem('punch.lang'); if (v === 'en' || v === 'zh') return v; } catch (e) {} return /^zh/i.test(navigator.language || '') ? 'zh' : 'en'; })();
  const EN = LANG === 'en';
  const TX = (zh, en) => (EN ? en : zh);
  const WK = EN ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] : ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  /* static text */
  (() => {
    const btn = $('#langBtn'); btn.textContent = EN ? '中文' : 'EN';
    btn.addEventListener('click', () => { try { localStorage.setItem('punch.lang', EN ? 'zh' : 'en'); } catch (e) {} try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: 'lang-' + (EN ? 'zh' : 'en'), title: 'lang', event: true }); } catch (e) {} setTimeout(() => location.reload(), 150); });
    if (!EN) return;
    document.documentElement.lang = 'en'; document.title = 'Punch Clock';
    const T = (sel, text, attrs, all) => { const ns = all ? document.querySelectorAll(sel) : [document.querySelector(sel)]; ns.forEach(n => { if (!n) return; if (text != null) n.textContent = text; for (const a in attrs || {}) n.setAttribute(a, attrs[a]); }); };

  async function punchOut() {
    const cur = state.current; if (busy || !cur) return;
    busy = true;
    clearTimeout(pendingEdit); pendingEdit = null;
    ended.add(cur.start);
    const cat = cur.cat, task = $('#cTask').value.trim() || cat, desc = $('#cDesc').value.trim();
    if (cardY > OUT_AT) await setY(OUT_AT, 200, 'ease-in');
    jolt(); sndClunk(); sndPrint(); lcdSay(TX('打印中…', 'PRINTING…'));
    const end = Date.now(); const touched = []; let s = cur.start, lastId = null;
    while (s < end) {
      const e = Math.min(end, nextMidnight(s)), k = keyOf(s); lastId = newId();
      (state.days[k] = state.days[k] || []).push({ id: lastId, cat, task, desc, start: s, end: e });
      touched.push(k); s = e;
    }
    freshId = lastId;
    state.current = null; state.viewDate = keyOf(end);
    $('#ledIn').classList.remove('on'); $('#ledOut').classList.add('on');
    render();
    await wait(reduced ? 0 : 380);

    await setY(OUT - 14, 240, 'cubic-bezier(.1,.7,.3,1)');
    sndBeep(2); lcdSay(`OUT ${hm(end)} OK`, 2000);
    await setY(OUT, 260, 'cubic-bezier(.3,1.5,.5,1)');

  }

  /* ── derived ── */

  /* ── report: 日报 / 周报 / 月报 ── */
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  const weekStart = k => { const d = new Date(startOfKey(k)); return shiftKey(k, -((d.getDay() + 6) % 7)); };

  function keysFor(k, v) {

  function barChart(box, per, today) {
    const W = Math.max(280, box.clientWidth || 600), H = 210, L = 40, R = 8, T = 12, B = 34;
    const maxM = Math.max(60, ...per.map(p => p.used));
    const step = [1, 2, 3, 4, 6, 8][[1, 2, 3, 4, 6, 8].findIndex(s => maxM / 60 / s <= 5)] || 8;
    const topH = Math.ceil(maxM / 60 / step) * step, topM = topH * 60;
    const y = m => T + (1 - m / topM) * (H - T - B);
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': TX('每日用时柱状图', 'Daily time bar chart') });
    for (let h = 0; h <= topH; h += step) {

        const yy = y1, x = cx - bw / 2, r = top ? Math.min(4, bw / 2, h) : 0;
        const d = `M${x},${yy + h} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${yy + h} Z`;

      });

      };
      hit.addEventListener('mouseenter', enter);
      hit.addEventListener('mouseleave', () => { hit.classList.remove('on'); hideTip(box); });
      hit.addEventListener('click', () => openDay(p.k));
    });
    box.appendChild(svg);
  }

  function catBars(parent, byMs) {

    if (!tot) { parent.appendChild(el('div', 'nodata', TX('这一期还没有记录。', 'No records for this period yet.'))); return; }

      const tr = el('span', 'tr'); const fl = el('span', 'fl'); fl.style.display = 'block'; fl.style.width = (byMs[c] / max * 100) + '%'; fl.style.background = catColor(c); tr.appendChild(fl);
      const vl = el('span', 'vl', hmDur(mins(byMs[c]))); vl.appendChild(el('small', null, Math.round(byMs[c] / tot * 100) + '%'));

  // Share of the whole day: each category and the free time as a fraction of 24h × days.
  function shareSection(doc, byCat, days, entries) {

    const cats = Object.keys(byCat).sort((a, b) => catOrder(a) - catOrder(b));

    const pct = m => (m / base * 100);
    const fmtPct = m => { const v = pct(m); return (v > 0 && v < 1 ? v.toFixed(1) : Math.round(v)) + '%'; };
    const bar = el('div', 'share'); bar.setAttribute('role', 'img');

    for (const c of cats) { const m = mins(byCat[c]); if (!m) continue; const i = el('i'); i.style.flex = `${m} 0 0`; i.style.background = catColor(c); i.title = `${c} ${hmDur(m)} · ${TX('占全天', 'of the day')} ${fmtPct(m)}`; bar.appendChild(i); }
    if (freeM) { const i = el('i', 'free'); i.style.flex = `${freeM} 0 0`; i.title = `${TX('空余', 'Free')} ${hmDur(freeM)} · ${fmtPct(freeM)}`; bar.appendChild(i); }
    sec.appendChild(bar);
    const two = el('div', 'two'); sec.appendChild(two);
    const left = el('div'); left.appendChild(el('p', 'subh', TX(`已记录 ${hmDur(usedM)}，占 ${fmtPct(usedM)}`, `Logged ${hmDur(usedM)}, ${fmtPct(usedM)}`)));
    const rows = el('div', 'cbars');
    const row = (sw, name, m, cls, fillCls, color) => {
      const r = el('div', 'cbar' + (cls ? ' ' + cls : '')); const nm = el('span', 'nm'); nm.append(sw, name);
      const tr = el('span', 'tr'); const fl = el('span', 'fl' + (fillCls ? ' ' + fillCls : '')); fl.style.display = 'block'; fl.style.width = pct(m) + '%'; if (color) fl.style.background = color; tr.appendChild(fl);

    rows.appendChild(row(el('span', 'sw free'), TX('空余', 'Free'), freeM, 'freerow', 'free'));

      const tr = el('span', 'tr'); const fl = el('span', 'fl'); fl.style.display = 'block'; fl.style.width = (m / blockBase * 100) + '%'; fl.style.background = 'var(--c1)'; tr.appendChild(fl);
      const vl = el('span', 'vl', hmDur(m)); const v = m / blockBase * 100; vl.appendChild(el('small', null, (v > 0 && v < 1 ? v.toFixed(1) : Math.round(v)) + '%'));

  function renderSheet() {

    const b = el('div', 'xb'); b.append(el('span', null, 'TIME CARD'), el('b', null, TX('考勤卡', 'IN · OUT'))); c.appendChild(b);
    const m = el('div', 'xm');
    m.append(el('span', null, 'NO.'), el('span', 'no', state.cardNo || '—'), el('span', null, TX('姓名', 'Name')), el('span', 'v', state.name || ''));
    const pr = el('div', 'p'); pr.append(el('span', null, view === 'day' ? TX('日期', 'Date') : TX('期间', 'Period')), el('span', 'v', P.range)); m.appendChild(pr);
    c.appendChild(m);
    c.appendChild(el('h4', null, TX('考 勤 卡', 'TIME CARD')));
    const t = el('table'); const cg = el('colgroup');
    ['17%', '13%', '31%', '13%', '13%', '13%'].forEach(w => { const col = el('col'); col.style.width = w; cg.appendChild(col); }); t.appendChild(cg);
    const hr = el('tr'); (EN ? ['Date', 'Category', 'Task', 'In', 'Out', 'Time'] : ['日期', '类别', '事项', '开始', '结束', '用时']).forEach(x => hr.appendChild(el('th', null, x))); const th = el('thead'); th.appendChild(hr); t.appendChild(th);
    const tb = el('tbody'); let total = 0, count = 0;
    const days = P.keys.filter(k => view !== 'month' || k <= today || dayEntries(k).length);
    for (const k of days) {
      const list = dayEntries(k);
      if (!list.length) { if (view === 'day') { const tr = el('tr'); const td = el('td', 'd', TX('这一天没有记录', 'No records this day')); td.colSpan = 6; tr.appendChild(td); tb.appendChild(tr); } else { const tr = el('tr'); tr.appendChild(el('td', 'd', `${md(k)} ${wk(k)}`)); for (let i = 0; i < 5; i++) tr.appendChild(el('td')); tb.appendChild(tr); } continue; }
      list.forEach((e, i) => {
        const tr = el('tr'); total += e.end - e.start; count++;
        tr.appendChild(el('td', 'd', i ? '' : `${md(k)} ${wk(k)}`));
        tr.appendChild(el('td', 'c', e.cat));
        tr.appendChild(el('td', 't', e.task === e.cat ? '' : e.task));
        tr.appendChild(el('td', null, hm(e.start)));
        tr.appendChild(el('td', 'o', e.live ? '' : (e.end === nextMidnight(startOfKey(k)) ? '24:00' : hm(e.end))));
        tr.appendChild(el('td', null, durShort(mins(e.end - e.start))));
        tb.appendChild(tr);
      });
    }
    for (let i = tb.children.length; i < 6; i++) { const tr = el('tr'); for (let j = 0; j < 6; j++) tr.appendChild(el('td')); tb.appendChild(tr); }
    t.appendChild(tb); c.appendChild(t);
    const passedN = Math.max(1, P.keys.filter(k => k <= today).length);
    const usedM = mins(total);
    const fbar = el('div', 'xf');
    const s1 = el('span', null, TX('合计', 'Total')); s1.appendChild(el('b', null, durShort(usedM)));
    const s2 = el('span', null, TX('段数', 'Entries')); s2.appendChild(el('b', null, String(count)));
    const s3 = el('span', null, TX('空余', 'Free')); s3.appendChild(el('b', null, durShort(Math.max(0, 1440 * passedN - usedM))));
    fbar.append(s1, s2, s3); c.appendChild(fbar);
    const now = new Date(); const xs = el('div', 'xs'); xs.append(el('span', null, `${TX('打印于', 'Printed')} ${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${hm(now)}`), el('span', null, TX('PUNCH-24 专用卡', 'PUNCH-24 CARD'))); c.appendChild(xs);
    return box;
  }
  $('#expReport').addEventListener('click', e => { const P = periodName(); exportPdf(e.currentTarget, buildReport, `${P.en}_${P.file}.pdf`, 210, 297); track('export-report-' + view); });
  $('#expCard').addEventListener('click', e => { const P = periodName(); exportPdf(e.currentTarget, buildCard, `time-card_${P.file}.pdf`, 120, 0); track('export-card-' + view); });

  function render() { renderMachine(); renderSheet(); }

  $('#addBtn').addEventListener('click', () => openEdit(state.viewDate, null));
  let lastViewW = 0;
  if (window.ResizeObserver) new ResizeObserver(() => { const w = $('#view').clientWidth; if (Math.abs(w - lastViewW) > 8) { lastViewW = w; if (state.mode !== 'loading') renderSheet(); } }).observe($('#view'));

  /* ── tick ── */
  let lastMinute = -1;
  function tick() {
    const now = new Date(), h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
    $('#hH').style.transform = `translateX(-50%) rotate(${h * 30 + m * 0.5}deg)`;
    $('#hM').style.transform = `translateX(-50%) rotate(${m * 6 + s * 0.1}deg)`;
    $('#hS').style.transform = `translateX(-50%) rotate(${s * 6}deg)`;
    paintLcd();
    if (state.current) {
      $('#elapsed').textContent = hms(now - state.current.start);
      const ld = $('#liveDur'); if (ld) ld.textContent = durShort(mins(now - Math.max(state.current.start, startOfKey(state.viewDate))));
    }
    if (m !== lastMinute) { lastMinute = m; if (state.mode !== 'loading' && !busy) { renderSheet(); } }
  }
  tick(); setInterval(tick, 1000);

  /* ── period nav ── */
  const go = k => { state.viewDate = k; renderSheet(); };
  function step(n) {
    const k = state.viewDate;
    if (view === 'day') return go(shiftKey(k, n));
    if (view === 'week') return go(shiftKey(k, 7 * n));
    const [y, m] = k.split('-').map(Number); go(keyOf(new Date(y, m - 1 + n, 1).getTime()));
  }
  $('#prevP').addEventListener('click', () => step(-1));
  $('#nextP').addEventListener('click', () => step(1));
  $('#todayBtn').addEventListener('click', () => go(keyOf(Date.now())));
  $('#dayPick').addEventListener('change', e => { if (/^\d{4}-\d\d-\d\d$/.test(e.target.value)) go(e.target.value); });
  document.querySelectorAll('.seg3 button').forEach(b => b.addEventListener('click', () => { view = b.dataset.v; saveView(); renderSheet(); track('view-' + view); }));

  /* ── fit the machine to the window ── */
  const sceneEl = $('#scene'), sceneBox = $('#sceneBox'), leftCol = $('#left');
  function fitScene() {
    const H = sceneEl.offsetHeight, desk = matchMedia('(min-width: 881px) and (min-height: 560px)').matches;
    const byH = desk ? leftCol.clientHeight / H : 1.15;
    const byW = (leftCol.clientWidth || window.innerWidth - 32) / 340;
    const k = Math.max(0.45, Math.min(1.35, byH, byW));
    sceneEl.style.transform = `scale(${k})`;
    sceneBox.style.width = (340 * k) + 'px'; sceneBox.style.height = (H * k) + 'px';
  }
  window.addEventListener('resize', fitScene);
  if (window.ResizeObserver) new ResizeObserver(fitScene).observe(leftCol);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitScene);
  fitScene();

  /* ── edit dialog ── */
  const dlg = $('#dlg'); let editing = null;
  function openEdit(k, id) {
    const e = id ? (state.days[k] || []).find(x => x.id === id) : null;
    if (id && !e) return;
    editing = { k, id };
    $('#dTitle').textContent = (id ? TX('修改这一段 · ', 'Edit entry · ') : TX('补记一段 · ', 'Add entry · ')) + k;
    const sel = $('#eCat'); sel.textContent = '';
    const opts = state.cats.slice(); const cur = e ? e.cat : (state.cats.includes(selCat) ? selCat : state.cats[0]); if (!opts.includes(cur)) opts.unshift(cur);
    for (const c of opts) { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); }
    sel.value = cur;
    $('#eTask').value = e && e.task !== e.cat ? e.task : ''; $('#eDesc').value = e ? e.desc : '';
    const now = Date.now(), isToday = k === keyOf(now);
    const defStart = isToday ? Math.max(startOfKey(k), now - 3600000) : startOfKey(k) + 9 * 3600000;
    $('#eStart').value = hm(e ? e.start : defStart);
    $('#eEnd').value = e ? (e.end === nextMidnight(startOfKey(k)) ? '00:00' : hm(e.end)) : hm(isToday ? now : defStart + 3600000);
    $('#dErr').textContent = '';
    const del = $('#dDel'); del.hidden = !id; del.classList.remove('armed'); del.textContent = TX('删除', 'Delete');
    try { dlg.showModal(); } catch (err) { dlg.setAttribute('open', ''); }
    $('#eCat').focus();
  }
  const closeEdit = () => { editing = null; if (dlg.open) dlg.close(); };
  $('#dCancel').addEventListener('click', closeEdit);
  $('#dDel').addEventListener('click', () => {
    const b = $('#dDel');
    if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = TX('确认删除', 'Confirm delete'); return; }
    const { k, id } = editing; state.days[k] = (state.days[k] || []).filter(x => x.id !== id);
    closeEdit(); render(); saveDay(k); toast(TX('已删除这一段', 'Entry deleted'));
  });
  $('#dForm').addEventListener('submit', ev => {
    ev.preventDefault(); if (!editing) return;
    const { k, id } = editing; const cat = $('#eCat').value; const task = $('#eTask').value.trim() || cat;
    if (!cat) { $('#dErr').textContent = TX('请选择类别。', 'Please choose a category.'); return; }
    if (!$('#eStart').value || !$('#eEnd').value) { $('#dErr').textContent = TX('请填写开始和结束时间。', 'Please fill in the start and end times.'); return; }
    const toMs = v => { const [h, m] = v.split(':').map(Number); return startOfKey(k) + (h * 60 + m) * 60000; };
    const start = toMs($('#eStart').value);
    const end = $('#eEnd').value === '00:00' ? nextMidnight(startOfKey(k)) : toMs($('#eEnd').value);
    if (end <= start) { $('#dErr').textContent = TX('结束时间要晚于开始时间（跨午夜请分两天记）。', 'End must be after start (split entries that cross midnight into two days).'); return; }
    const list = state.days[k] = state.days[k] || [];
    const rec = { id: id || newId(), cat, task, desc: $('#eDesc').value.trim(), start, end };
    const i = list.findIndex(x => x.id === id); if (i >= 0) list[i] = rec; else list.push(rec);
    closeEdit(); render(); saveDay(k); toast(id ? TX('已保存修改', 'Changes saved') : TX('已补记', 'Entry added')); track(id ? 'entry-edit' : 'entry-add');
  });

  /* ── anonymous usage stats (GoatCounter): only event names, never record content ── */
  const track = name => { try { if (window.goatcounter && typeof window.goatcounter.count === 'function') window.goatcounter.count({ path: name, title: name, event: true }); } catch (e) {} };

  /* ── feedback link: set FEEDBACK_URL to show the button ── */
  const FEEDBACK_URL = 'https://github.com/YuanzheWang236/punch-clock/issues';
  if (FEEDBACK_URL) { const a = $('#fbLink'); a.href = FEEDBACK_URL; a.hidden = false; a.addEventListener('click', () => track('feedback')); }

  /* ── backup / restore (local mode) ── */
  $('#bakOut').addEventListener('click', () => {
    const data = { app: 'punch-clock', version: 1, exportedAt: new Date().toISOString(), days: state.days, current: state.current, goal: state.goal, cats: state.cats, cardNo: state.cardNo, name: state.name };
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = `punch-clock-backup_${keyOf(Date.now())}.json`; a.style.display = 'none';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
    const n = Object.values(state.days).reduce((t, l) => t + l.length, 0);
    toast(TX(`已导出备份：${n} 条记录`, `Backup saved: ${plural(n, 'record')}`)); track('backup-export');
  });
  $('#bakIn').addEventListener('click', () => { if (state.mode === 'local') $('#bakFile').click(); });
  $('#bakFile').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    let raw; try { raw = JSON.parse(await f.text()); } catch (err) { toast(TX('这个文件不是有效的备份', 'This file isn’t a valid backup')); return; }
    if (!raw || typeof raw !== 'object' || !raw.days || typeof raw.days !== 'object') { toast(TX('这个文件不是有效的备份', 'This file isn’t a valid backup')); return; }
    let added = 0;
    for (const k in raw.days) {
      if (!/^\d{4}-\d\d-\d\d$/.test(k)) continue;
      const list = state.days[k] || [];
      const seen = new Set(list.map(x => x.id)), spans = new Set(list.map(x => x.start + '-' + x.end));
      for (const x of cleanEntries(raw.days[k])) { if (seen.has(x.id) || spans.has(x.start + '-' + x.end)) continue; list.push(x); seen.add(x.id); spans.add(x.start + '-' + x.end); added++; }
      if (list.length) state.days[k] = list.sort((a, b) => a.start - b.start);
    }
    if (Array.isArray(raw.cats)) state.cats = cleanCats(state.cats.concat(raw.cats));
    if (!state.current) { const c = cleanCurrent(raw.current); if (c) applyCurrent(c); }
    if (!state.cardNo) { state.cardNo = str(raw.cardNo, 6).trim(); $('#cNo').value = state.cardNo; }
    if (!state.name) { state.name = str(raw.name, 12).trim(); $('#cName').value = state.name; }
    saveLocal(); render();
    toast(added ? TX(`已恢复 ${added} 条记录`, `Restored ${plural(added, 'record')}`) : TX('备份里的记录本机都已经有了', 'Everything in this backup is already here')); track('backup-import');
  });

  setY(OUT);
  render();
  boot();
})();
</script>
